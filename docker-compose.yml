# Optional development database. Production managed hosting supplies MariaDB.
services:
  db:
    image: mariadb:10.11
    container_name: ourdealshub-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: local-root-only
      MARIADB_USER: ourdealshub
      MARIADB_PASSWORD: ourdealshub
      MARIADB_DATABASE: ourdealshub
    volumes:
      - ourdealshub_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ourdealshub_mariadb:
