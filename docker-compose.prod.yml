# Production / self-hosted stack: MariaDB + migrations + Next.js + Caddy (HTTPS).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Reads ./.env (see .env.example, "Self-hosted (Docker)" section).
# For local dev, `npm run db:up` (docker-compose.yml) still starts MariaDB only.

name: ourdealshub

x-app-env: &app-env
  env_file: .env
  environment:
    # Inside the compose network MariaDB is "db", not localhost
    DATABASE_URL: mysql://ourdealshub:${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}@db:3306/ourdealshub?connection_limit=5

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_USER: ourdealshub
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      MARIADB_DATABASE: ourdealshub
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published port — only reachable by the app on the compose network

  migrate:
    build:
      context: .
      target: migrate
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
    <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
    <<: *app-env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      CADDY_TLS: ${CADDY_TLS:-internal}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  mariadb_data:
  caddy_data:
  caddy_config:
